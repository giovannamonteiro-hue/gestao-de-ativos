<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPNvnhQ9o0CtjIoEHjBewjX6NmNLj5VE",
        authDomain: "spx-ativos.firebaseapp.com",
        projectId: "spx-ativos",
        storageBucket: "spx-ativos.appspot.com",
        messagingSenderId: "513330837557",
        appId: "1:513330837557:web:2dc71333d515982176197c",
        measurementId: "G-S7BBZK5LVE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 1. Escutar alterações de autenticação (Garante voltar ao Login ao sair)
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            // Se não estiver logado, limpa sessões guardadas e redireciona/recarrega
            console.log("Nenhum usuário autenticado. Exibindo tela de login.");
            // Se o seu login fica em outra página ou div, ajuste aqui.
            // Para forçar a recarga limpa da página de login:
            if (window.location.hash !== "#login") {
                window.location.href = window.location.pathname;
            }
        } else {
            console.log("Usuário logado:", user.email);
        }
    });

    // 2. Função global para Sair do Sistema
    window.handleLogout = async function() {
        try {
            await signOut(auth);
            // Limpa dados locais guardados no navegador
            localStorage.clear();
            sessionStorage.clear();
            // Recarrega a página para voltar à tela inicial de Login
            window.location.reload();
        } catch (error) {
            alert("Erro ao encerrar sessão: " + error.message);
        }
    };
</script>
